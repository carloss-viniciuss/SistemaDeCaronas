<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fechamento Mensal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; padding: 16px; margin: 0; color: #0f172a; }
        .nav-link { display: inline-block; margin-bottom: 16px; color: #2563eb; text-decoration: none; font-weight: bold; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .btn-pdf { display: block; width: 100%; text-align: center; background: #059669; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 12px; }
    </style>
</head>
<body>
    <a href="{% url 'registrar_caronas' %}" class="nav-link">← Voltar para Registro</a>
    <h1>Fechamento de Contas</h1>

    {% for item in dados %}
        <div class="card">
            <h2>{{ item.passageiro.nome }}</h2>
            <p>Trajetos Pendentes: <strong>{{ item.qtd }}</strong></p>
            <p style="font-size: 1.2rem; color: #d97706; font-weight: bold;">Total: R$ {{ item.total|floatformat:2 }}</p>

            {% if item.qtd > 0 %}
                <a href="{% url 'gerar_pdf_cobranca' item.passageiro.id %}" target="_blank" class="btn-pdf">📄 Gerar Relatório / PDF</a>
            {% else %}
                <p style="color: #059669; font-weight: bold;">✓ Conta zerada!</p>
            {% endif %}
        </div>
    {% endfor %}
</body>
</html>
