<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Passageiro</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; padding: 16px; margin: 0; color: #0f172a; }
        .wrapper { max-width: 500px; margin: 0 auto; }
        .nav-link { display: inline-block; margin-bottom: 16px; color: #2563eb; text-decoration: none; font-weight: bold; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9rem; color: #334155; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
        input[type="text"]:focus, input[type="number"]:focus { border-color: #2563eb; }
        .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 8px; }
        .btn-submit:active { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="wrapper">
        <a href="{% url 'registrar_caronas' %}" class="nav-link">← Voltar para Registro</a>

        <div class="card">
            <h2 style="margin-top: 0; font-size: 1.3rem;">➕ Cadastrar Passageiro</h2>
            <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 20px;">Informe o nome e o valor padrão por trecho (Ida ou Volta).</p>

            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="nome">Nome do Passageiro:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Lucas Silva" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="valor_percurso">Valor por Trecho (R$):</label>
                    <input type="number" id="valor_percurso" name="valor_percurso" step="0.01" min="0" placeholder="Ex: 8.50" required>
                </div>

                <button type="submit" class="btn-submit">Salvar Passageiro</button>
            </form>
        </div>
    </div>

</body>
</html>
