<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo do Dia</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; padding: 16px; margin: 0; color: #0f172a; }
        .nav-link { display: inline-block; margin-bottom: 16px; color: #2563eb; text-decoration: none; font-weight: bold; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 8px 0; }
        .btn-edit { background: #e2e8f0; color: #334155; text-decoration: none; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <a href="{% url 'registrar_caronas' %}" class="nav-link">← Voltar para Registro</a>
    
    <h1>Caronas de Hoje ({{ hoje|date:"d/m/Y" }})</h1>
    <div class="card" style="background: #1e293b; color: white;">
        <p style="margin:0; font-size: 0.85rem; opacity: 0.8;">Total acumulado hoje:</p>
        <h2 style="margin:4px 0 0 0;">R$ {{ total_dia|floatformat:2 }}</h2>
    </div>

    <div class="card">
        {% for reg in registros %}
            <div class="item">
                <div>
                    <strong>{{ reg.passageiro.nome }}</strong> - {{ reg.get_tipo_display }}
                    <div style="font-size: 0.8rem; color: #64748b;">R$ {{ reg.valor_total }}</div>
                </div>
                <a href="{% url 'editar_carona' reg.id %}" class="btn-edit">Editar</a>
            </div>
        {% empty %}
            <p style="color: #64748b; margin:0;">Nenhuma carona registrada hoje.</p>
        {% endfor %}
    </div>
</body>
</html>
