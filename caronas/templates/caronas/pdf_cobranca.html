<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Relatorio_Caronas_{{ passageiro.nome }}</title>
    <style>
        body { font-family: sans-serif; padding: 24px; color: #111; max-width: 600px; margin: 0 auto; }
        .header { text-align: center; border-bottom: 2px solid #222; padding-bottom: 12px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .total-box { font-size: 1.3rem; text-align: right; margin-top: 20px; font-weight: bold; }
        .btn-print { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 16px; }
        @media print { .btn-print { display: none; } }
    </style>
</head>
<body>

    <button onclick="window.print()" class="btn-print">🖨️ Salvar como PDF / Imprimir</button>

    <div class="header">
        <h2>Demonstrativo de Caronas</h2>
        <p>Passageiro: <strong>{{ passageiro.nome }}</strong> | Emissão: {{ data_emissao|date:"d/m/Y H:i" }}</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Trajeto</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody>
            {% for c in caronas %}
                <tr>
                    <td>{{ c.data|date:"d/m/Y" }}</td>
                    <td>{{ c.get_tipo_display }}</td>
                    <td>R$ {{ c.valor_total }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="total-box">
        Total a Pagar: R$ {{ total|floatformat:2 }}
    </div>

</body>
</html>
